<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Smart Emergency Hospital Finder</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(to right,#caf0f8,#ade8f4);
}

.header{
    background:#0077b6;
    color:white;
    padding:20px;
    text-align:center;
    font-size:30px;
    font-weight:bold;
    box-shadow:0px 3px 10px gray;
}

.container{
    text-align:center;
    margin-top:40px;
}

.box{
    background:white;
    width:420px;
    margin:auto;
    padding:30px;
    border-radius:20px;
    box-shadow:0px 0px 15px gray;
}

input,select{
    width:90%;
    padding:12px;
    margin-top:15px;
    border-radius:10px;
    border:1px solid gray;
    font-size:16px;
}

button{
    margin-top:20px;
    padding:12px 25px;
    background:#0096c7;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    transition:0.3s;
}

button:hover{
    background:#023e8a;
    transform:scale(1.05);
}

#result{
    margin-top:30px;
}

.card{
    background:white;
    width:350px;
    margin:20px auto;
    padding:20px;
    border-radius:20px;
    box-shadow:0px 0px 15px gray;
}

.emergency{
    color:red;
    font-weight:bold;
    font-size:18px;
}

.tip{
    color:green;
    margin-top:10px;
    font-weight:bold;
}

.mapbtn{
    background:green;
    color:white;
    padding:10px 15px;
    border-radius:10px;
    display:inline-block;
    margin-top:15px;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="header">
🚑 Smart Emergency Hospital Finder
</div>

<div class="container">

<div class="box">

<h2>Find Emergency Hospitals</h2>

<input
type="text"
id="location"
placeholder="📍 Enter Your Location">

<select id="problem">

<option value="">
Select Health Problem
</option>

<option value="fever">
🤒 Fever
</option>

<option value="injury">
🦴 Injury
</option>

<option value="heart">
❤️ Heart Problem
</option>

<option value="child">
👶 Child Care
</option>

</select>



<input
type="text"
id="otherProblem"
placeholder="✍ Enter Other Health Problem">

<br>

<button onclick="findHospital()">
Search Hospital
</button>

<div id="result"></div>

</div>

</div>

<script>

function findHospital()
{
    let location =
    document.getElementById("location").value



    let problem =
    document.getElementById("problem").value



    let otherProblem =
    document.getElementById("otherProblem").value



    if(problem=="")
    {
        problem = otherProblem
    }



    let tip = ""



    if(problem=="fever")
    {
        tip =
        "💧 Drink water and take rest"
    }

    else if(problem=="injury")
    {
        tip =
        "🩹 Avoid movement and seek medical help"
    }

    else if(problem=="heart")
    {
        tip =
        "❤️ Stay calm and contact emergency services"
    }

    else if(problem=="child")
    {
        tip =
        "👶 Keep the child hydrated and consult doctor"
    }

    else
    {
        tip =
        "🏥 Please consult nearby medical professionals"
    }



    let output = `

    <div class="card">

    <h2>
    🏥 Hospitals Near ${location}
    </h2>

    <div class="emergency">
    🚑 Emergency Support Available
    </div>

    <p>
    🩺 Problem :
    ${problem}
    </p>

    <p>
    ⭐ Top hospitals and ratings will open in Google Maps
    </p>

    <div class="tip">
    ${tip}
    </div>

    <br>

    <b>Emergency Numbers:</b>

    <p>
    🚑 Ambulance : 108
    </p>

    <p>
    👮 Police : 100
    </p>

    <a
    class="mapbtn"

    href="https://www.google.com/maps/search/hospitals+near+${location}"

    target="_blank">

    🗺 View Nearby Hospitals

    </a>

    </div>

    `



    document.getElementById("result").innerHTML =
    output



    let speech =
    new SpeechSynthesisUtterance(
    "Nearby emergency hospitals found successfully"
    )

    speechSynthesis.speak(speech)

}

</script>

</body>
</html>
