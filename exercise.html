<!DOCTYPE html>
<html>
<head>
<title>Arogya Mithra Exercise Guide</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f7fb;
text-align:center;
}

h1{
color:#2e8b57;
}

select{
padding:10px;
font-size:16px;
margin:20px;
}

#cards{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
}

.card{
width:250px;
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
cursor:pointer;
transition:0.3s;
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.card h3{
padding:10px;
}

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
}

.popup{
background:white;
width:80%;
max-width:500px;
margin:60px auto;
padding:20px;
border-radius:15px;
text-align:left;
}

button{
padding:8px 15px;
}
</style>
</head>

<body>

<h1>🏃 Arogya Mithra Exercise Guide</h1>

<select id="goal" onchange="showExercises()">
<option value="">Select Goal</option>
<option value="weightloss">🔥 Weight Loss</option>
<option value="muscle">💪 Muscle Building</option>
<option value="heart">❤️ Heart Health</option>
<option value="yoga">🧘 Yoga</option>
<option value="stress">🧘 Stress Relief</option>
<option value="student">🎓 Student Fitness</option>
</select>

<div id="cards"></div>

<div class="modal" id="modal">
<div class="popup">
<button onclick="closeModal()">Close</button>
<h2 id="title"></h2>
<p id="benefits"></p>
<p id="limitations"></p>
<p id="duration"></p>
</div>
</div>

function showExercises(){

let goal=document.getElementById("goal").value;
let cards=document.getElementById("cards");

cards.innerHTML="";

if(!goal) return;

data[goal].forEach(ex=>{

cards.innerHTML+=`
<div class="card" onclick='showDetails(${JSON.stringify(ex)})'>
<img src="${ex.img}">
<h3>${ex.name}</h3>
</div>
`;

});
}

function showDetails(ex){

document.getElementById("title").innerHTML=ex.name;
document.getElementById("benefits").innerHTML="<b>Benefits:</b> "+ex.benefits;
document.getElementById("limitations").innerHTML="<b>Limitations:</b> "+ex.limitations;
document.getElementById("duration").innerHTML="<b>Recommended:</b> "+ex.duration;

document.getElementById("modal").style.display="block";
}

function closeModal(){
document.getElementById("modal").style.display="none";
}
